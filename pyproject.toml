[project]
name = "litestar-keycloak-admin"
version = "0.1.0"
description = "Keycloak user management for Litestar on top of litestar-keycloak: password login proxy, registration, profile and an Admin REST API client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "click>=8.1",
    "litestar>=2.24.0",
    "litestar-keycloak>=0.3.2,<0.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
